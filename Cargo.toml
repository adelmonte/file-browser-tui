[package]
name = "file-browser-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"

[[bin]]
name = "file-browser-tui"
path = "src/main.rs"

[dependencies]
ratatui          = "0.30.0"
ratatui-image    = { version = "11.0.2", default-features = false, features = ["crossterm", "image-defaults"] }
image            = { version = "0.25.10", features = ["png", "jpeg", "gif", "webp"] }
serde            = { version = "1.0", features = ["derive"] }
toml             = "0.8"
anyhow           = "1.0"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lru              = "0.16"
rayon            = "1.12"
nix              = { version = "0.30.1", features = ["inotify", "poll", "fs", "user"] }
dirs             = "5.0"
chrono           = { version = "0.4", default-features = false, features = ["std", "clock"] }
strum            = { version = "0.27", features = ["derive"] }
new_mime_guess = "4.0.4"
md5 = "0.8.0"
unicode-width = "0.2"
